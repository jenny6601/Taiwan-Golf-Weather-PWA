name: ECMWF AIFS 15-day hourly cache (57 courses)

on:
  workflow_dispatch:
  schedule:
    # AIFS runs at 00/06/12/18 UTC; collect four times daily.
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: aifs-forecast-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PWA
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate 57-course AIFS cache
        env:
          AIFS_OUT: /tmp/aifs-cache
        run: python scripts/build_aifs_cache.py "$AIFS_OUT"
      - name: Upload AIFS cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aifs-cache-artifact
          path: /tmp/aifs-cache
          if-no-files-found: warn
          retention-days: 14
      - name: Publish AIFS cache branch
        env:
          AIFS_OUT: /tmp/aifs-cache
        run: |
          test -s "$AIFS_OUT/index.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan aifs-cache
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -R "$AIFS_OUT/." .
          git add -A
          git commit -m "Publish 57-course ECMWF AIFS forecast cache"
          git push origin HEAD:refs/heads/aifs-cache --force
