name: Daily 16-day forecast crosscheck (5 pilot courses)

on:
  workflow_dispatch:
  schedule:
    # 05:30 Asia/Taipei (UTC+8), before the 06:00 user-facing forecast review.
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: forecast-crosscheck-pilot
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PWA
        uses: actions/checkout@v4
      - name: Run five-course 16-day comparison
        env:
          ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}
          QWEATHER_API_TOKEN: ${{ secrets.QWEATHER_API_TOKEN }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
        run: |
          python scripts/forecast_crosscheck.py forecast-crosscheck.json
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: forecast-crosscheck-${{ github.run_number }}
          path: forecast-crosscheck.json
          retention-days: 30
