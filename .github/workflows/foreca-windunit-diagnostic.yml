name: Foreca wind unit diagnostic (three courses, no cache writes)

on:
  workflow_dispatch:
  push:
    branches: [test/foreca-windunit-diagnostic]
    paths:
      - '.github/workflows/foreca-windunit-diagnostic.yml'
      - 'scripts/foreca_windunit_diagnostic.py'

permissions:
  contents: read

concurrency:
  group: foreca-windunit-diagnostic
  cancel-in-progress: false

jobs:
  compare:
    name: "Wind unit check - ${{ matrix.course }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - course: "林口"
            latitude: "25.0714"
            longitude: "121.3719"
          - course: "桃園"
            latitude: "24.8789"
            longitude: "121.2069"
          - course: "揚昇"
            latitude: "24.9208"
            longitude: "121.1878"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare KMH and MS responses from Foreca
        env:
          FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
        run: |
          python scripts/foreca_windunit_diagnostic.py \
            --course "${{ matrix.course }}" \
            --lat "${{ matrix.latitude }}" \
            --lon "${{ matrix.longitude }}" \
            --periods 48 \
            --out "/tmp/foreca-windunit-${{ matrix.course }}.json"
      - name: Publish aggregate diagnostic summary
        if: always()
        env:
          COURSE: "${{ matrix.course }}"
          LATITUDE: "${{ matrix.latitude }}"
          LONGITUDE: "${{ matrix.longitude }}"
        run: |
          REPORT="/tmp/foreca-windunit-${COURSE}.json"
          if [ -f "$REPORT" ]; then
            python - "$REPORT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(f"## Foreca wind-unit diagnostic - {d['course']}")
          print(f"- Coordinates: {d['latitude']}, {d['longitude']}")
          print(f"- Matched hours: {d['matched_hour_count']}")
          print(f"- Median relative error: {d['median_speed_relative_error_pct']}%")
          print(f"- Hours within 10%: {d['hours_within_10pct']}")
          print(f"- Result: **{d['speed_unit_test']}**")
          PY
          else
            echo "No report generated for ${COURSE}; inspect the job error." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload aggregate diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreca-windunit-${{ matrix.course }}
          path: "/tmp/foreca-windunit-${{ matrix.course }}.json"
          if-no-files-found: ignore
          retention-days: 1
