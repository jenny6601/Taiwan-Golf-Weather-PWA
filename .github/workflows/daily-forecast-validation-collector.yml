name: Daily Foreca VC forecast snapshot collector

on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"

permissions:
  contents: write

concurrency:
  group: daily-forecast-snapshot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic collector
        uses: actions/checkout@v4
        with:
          ref: test/foreca-windunit-diagnostic
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect snapshots
        env:
          FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/collect_validation_data.py forecast
      - name: Store snapshot on isolated validation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "forecast" = "observation" ]; then
            mkdir -p /tmp/validation-data/observations
            cp /tmp/cwa-observation.json /tmp/validation-data/observations/${RUN_ID}-${RUN_ATTEMPT}.json
            SRC=/tmp/validation-data/observations
          else
            mkdir -p /tmp/validation-data/forecasts
            cp /tmp/forecast-snapshot.json /tmp/validation-data/forecasts/${RUN_ID}-${RUN_ATTEMPT}.json
            SRC=/tmp/validation-data/forecasts
          fi
          git fetch origin weather-validation-data
          git checkout -B weather-validation-data origin/weather-validation-data
          mkdir -p validation-data
          if [ "forecast" = "observation" ]; then mkdir -p validation-data/observations; cp "${SRC}"/*.json validation-data/observations/; else mkdir -p validation-data/forecasts; cp "${SRC}"/*.json validation-data/forecasts/; fi
          git add validation-data
          git commit -m "Collect forecast validation snapshot ${RUN_ID}" || echo "No new snapshot to commit"
          git push origin weather-validation-data
