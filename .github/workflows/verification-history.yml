name: Forecast history and CWA verification (57 courses)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verification_history.py'
      - 'index.html'
      - '.github/workflows/verification-history.yml'
  schedule:
    # Run five minutes after the 10-minute CWA live-data publisher.
    - cron: "5,15,25,35,45,55 * * * *"

permissions:
  contents: write

concurrency:
  group: verification-history-writer
  cancel-in-progress: false

jobs:
  archive-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PWA scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout persistent verification history
        uses: actions/checkout@v4
        with:
          ref: verification-history
          path: history
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.current=None; self.parts=[]; self.files=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script":
                      attrs=dict(attrs)
                      self.current=not attrs.get("src") and attrs.get("type","").lower() not in ("application/json","application/ld+json")
                      self.parts=[]
              def handle_data(self, data):
                  if self.current: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current:
                      p=Path(f"/tmp/pwa-inline-{len(self.files)}.js")
                      p.write_text("".join(self.parts),encoding="utf-8")
                      self.files.append(str(p)); self.current=None
          parser=Scripts()
          parser.feed(Path("source/index.html").read_text(encoding="utf-8"))
          Path("/tmp/pwa-script-list.txt").write_text("\\n".join(parser.files),encoding="utf-8")
          print("Inline JavaScript blocks:",len(parser.files))
          PY
          while IFS= read -r file; do node --check "$file"; done < /tmp/pwa-script-list.txt
      - name: Archive CWA observations and daily forecast vintage
        run: python source/scripts/verification_history.py auto history | tee /tmp/verification-run.json
      - name: Add archive result to run summary
        if: always()
        run: |
          if [ -s /tmp/verification-run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          raw=Path("/tmp/verification-run.json").read_text(encoding="utf-8")
          # The archive script may print a warning before its final JSON document.
          start=raw.find("{")
          if start < 0:
              raise SystemExit("No JSON result found in verification run output")
          d=json.loads(raw[start:])
          print("## Archive result")
          for key in ("observation_archive","forecast_archive","verification"):
              value=d.get(key)
              if value is not None:
                  print(f"- **{key}:** {json.dumps(value,ensure_ascii=False)}")
          PY
          fi
      - name: Publish append-only history and verification weights
        run: |
          git -C history config user.name "github-actions[bot]"
          git -C history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C history add observations forecasts verification
          if git -C history diff --cached --quiet; then
            echo "No new observation or verification records."
          else
            git -C history commit -m "Archive CWA observations and forecast verification"
            git -C history push origin HEAD:verification-history
          fi
      - name: Summarize archive and verification status
        if: always()
        run: |
          {
            echo "## Taiwan Golf Weather verification"
            echo "- Run time (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            if [ -f history/verification/weights.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("history/verification/weights.json").read_text(encoding="utf-8"))
          print(f"- Weight status: {p.get('status')}")
          print(f"- Updated: {p.get('generated_at')}")
          for lead,row in p.get("lead_days",{}).items():
              print(f"- {lead}-day: active={row.get('weighting_active')}, samples={row.get('sample_count_by_source',{})}")
          PY
            else
              echo "- Weight status: warming up; waiting for completed forecast/observation pairs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
